name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  VERSION: "1.0.0"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore Ecommerce.sln

    - name: Build
      run: dotnet build Ecommerce.sln --configuration Release --no-restore

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

########################################################
# CUSTOMER
########################################################

    - name: Build Customer API
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Customer.Api/Dockerfile
        push: true
        tags: |
          sumit198/customer-api:${{ env.VERSION }}
          sumit198/customer-api:latest

########################################################
# INVENTORY
########################################################

    - name: Build Inventory API
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Inventory.Api/Dockerfile
        push: true
        tags: |
          sumit198/inventory-api:${{ env.VERSION }}
          sumit198/inventory-api:latest

########################################################
# PAYMENT
########################################################

    - name: Build Payment API
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Payment.Api/Dockerfile
        push: true
        tags: |
          sumit198/payment-api:${{ env.VERSION }}
          sumit198/payment-api:latest

########################################################
# NOTIFICATION
########################################################

    - name: Build Notification API
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Notification.Api/Dockerfile
        push: true
        tags: |
          sumit198/notification-api:${{ env.VERSION }}
          sumit198/notification-api:latest

########################################################
# ORDER
########################################################

    - name: Build Order API
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/Order.Api/Dockerfile
        push: true
        tags: |
          sumit198/order-api:${{ env.VERSION }}
          sumit198/order-api:latest

########################################################
# REACT UI
########################################################

    - name: Build React UI
      uses: docker/build-push-action@v6
      with:
        context: .
        file: src/WebUI/Dockerfile
        push: true
        tags: |
          sumit198/ecommerce-ui:${{ env.VERSION }}
          sumit198/ecommerce-ui:latest