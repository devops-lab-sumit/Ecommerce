apiVersion: apps/v1
kind: Deployment

metadata:
  name: Customer-api
  labels:
    app: Customer-api
    env: non-prod

spec:
  replicas: 2
  Selector:
    matchLabels:
      app: Customer-api
      env: non-prod

  template:
    metadata:
      labels:
        app: Customer-api
        env: non-prod

    spec:
      imagePullSecrets:
      - name: regcred  # <-- Links your deployment to the Docker Hub credentials
      containers:
      - name: Customer-api
        image: sumit198/customer-api:1.0.1
        imagePullPolicy: Always
        ports:
        - containerport: 80


