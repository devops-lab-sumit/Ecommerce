apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: database
spec:
  serviceName: mssql
  replicas: 1

  selector:
    matchLabels:
      app: mssql

  template:
    metadata:
      labels:
        app: mssql

    spec:
      containers:

      - name: mssql

        image: mcr.microsoft.com/mssql/server:2022-latest

        ports:
        - containerPort: 1433

        env:

        - name: ACCEPT_EULA
          value: "Y"

        - name: MSSQL_PID
          value: "Developer"

        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mssql-secret
              key: MSSQL_SA_PASSWORD

        volumeMounts:
        - mountPath: /var/opt/mssql
          name: sql-storage

  volumeClaimTemplates:

  - metadata:
      name: sql-storage

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 10Gi